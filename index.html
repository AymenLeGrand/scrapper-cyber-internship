<!DOCTYPE html>
<html lang="fr" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stages Cybersécurité & Cryptologie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css?v=7.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-full flex flex-col font-['Inter',sans-serif] bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white">

  <!-- Header -->
  <header class="border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-base font-semibold tracking-tight text-zinc-100">
          Stages Cybersécurité & Cryptologie
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <button id="headerSpontaneousBtn" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white transition">
          Candidatures spontanées
        </button>
        <button id="exportCsvBtn" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white transition">
          Export CSV
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-4">

    <!-- KPI Summary Bar -->
    <section class="grid grid-cols-3 gap-3">
      <div class="bg-zinc-900/40 p-3 rounded-lg border border-zinc-800/70">
        <div class="text-xs text-zinc-400">Total</div>
        <div id="statTotal" class="text-xl font-semibold text-zinc-100 mt-0.5">--</div>
      </div>
      <div class="bg-zinc-900/40 p-3 rounded-lg border border-zinc-800/70">
        <div class="text-xs text-zinc-400">Cryptologie</div>
        <div id="statCrypto" class="text-xl font-semibold text-indigo-400 mt-0.5">--</div>
      </div>
      <div class="bg-zinc-900/40 p-3 rounded-lg border border-zinc-800/70">
        <div class="text-xs text-zinc-400">Cyberdéfense</div>
        <div id="statCyber" class="text-xl font-semibold text-zinc-100 mt-0.5">--</div>
      </div>
    </section>

    <!-- Scan Countdown -->
    <div class="flex items-center justify-between px-3 py-2 rounded-lg border border-zinc-800/50 bg-zinc-900/20 text-xs text-zinc-500">
      <span>Prochain scan</span>
      <span id="nextScanTimer" class="font-mono text-zinc-400 tabular-nums">--h --m --s</span>
    </div>

    <!-- Candidatures Spontanées Section (Collapsible) -->
    <section id="spontaneousSection" class="bg-zinc-900/40 rounded-lg border border-zinc-800/70 p-3.5 transition">
      <button id="toggleSpontaneousBtn" class="w-full flex items-center justify-between text-left focus:outline-none cursor-pointer">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-zinc-200">Candidatures spontanées</span>
          <span class="text-xs text-zinc-500" id="spontaneousHeaderCount">• 44 entreprises</span>
        </div>
        <span id="spontaneousToggleText" class="text-xs text-zinc-400 hover:text-zinc-200">Afficher</span>
      </button>

      <div id="spontaneousContent" class="hidden mt-3 pt-3 border-t border-zinc-800/60 space-y-3">
        <!-- Spontaneous Category Chips -->
        <div class="flex flex-wrap items-center gap-1.5" id="spontaneousCategoryChips">
          <button data-spont-cat="all" class="category-chip active">Toutes (44)</button>
          <button data-spont-cat="hardware" class="category-chip">Sécu Embarquée & CESTI (6)</button>
          <button data-spont-cat="crypto" class="category-chip">Cryptologie & R&D (6)</button>
          <button data-spont-cat="offensive" class="category-chip">Offensive & Éditeurs (17)</button>
          <button data-spont-cat="consulting_defense" class="category-chip">Conseil, Défense & État (15)</button>
        </div>

        <div id="spontaneousGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
          <!-- Injected via JavaScript -->
        </div>
      </div>
    </section>

    <!-- Search & Filters -->
    <section class="bg-zinc-900/40 rounded-lg border border-zinc-800/70 p-3.5 space-y-3">
      <!-- Search Input -->
      <div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Rechercher une offre, une entreprise, une ville..."
          class="w-full px-3.5 py-2 text-sm bg-zinc-950 border border-zinc-800 rounded-md text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition"
        >
      </div>

      <!-- Filter Chips -->
      <div class="pt-2 border-t border-zinc-800/50">
        <div class="flex flex-wrap items-center gap-1.5" id="categoryChips">
          <button data-category="all" class="category-chip active">Toutes (<span id="countAll">0</span>)</button>
          <button data-category="crypto" class="category-chip">Cryptologie</button>
          <button data-category="offensive" class="category-chip">Offensive</button>
          <button data-category="defensive" class="category-chip">SOC / Détection</button>
          <button data-category="cloud_devsecops" class="category-chip">Cloud / DevSecOps</button>
          <button data-category="ai_cyber" class="category-chip">IA</button>
        </div>
      </div>

      <!-- Advanced Selectors: Company, Location, Age, Sort -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t border-zinc-800/50">
        <!-- Company selector -->
        <div>
          <label for="companyFilter" class="block text-[11px] font-medium text-zinc-400 mb-1">Entreprise</label>
          <select id="companyFilter" class="w-full text-xs bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1.5 text-zinc-300 focus:outline-none focus:border-zinc-700">
            <option value="all">Toutes les entreprises</option>
          </select>
        </div>

        <!-- Location selector -->
        <div>
          <label for="locationFilter" class="block text-[11px] font-medium text-zinc-400 mb-1">Ville / Hub</label>
          <select id="locationFilter" class="w-full text-xs bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1.5 text-zinc-300 focus:outline-none focus:border-zinc-700">
            <option value="all">Toutes les villes</option>
          </select>
        </div>

        <!-- Age selector -->
        <div>
          <label for="ageFilter" class="block text-[11px] font-medium text-zinc-400 mb-1">Ancienneté</label>
          <select id="ageFilter" class="w-full text-xs bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1.5 text-zinc-300 focus:outline-none focus:border-zinc-700">
            <option value="all">Toutes les dates</option>
            <option value="1">Moins de 24h</option>
            <option value="7">Moins de 7 jours</option>
            <option value="14">Moins de 14 jours</option>
            <option value="30">Moins de 30 jours</option>
          </select>
        </div>

        <!-- Sort selector -->
        <div>
          <label for="sortFilter" class="block text-[11px] font-medium text-zinc-400 mb-1">Trier par</label>
          <select id="sortFilter" class="w-full text-xs bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1.5 text-zinc-300 focus:outline-none focus:border-zinc-700">
            <option value="newest">Plus récentes d'abord</option>
            <option value="oldest">Plus anciennes d'abord</option>
            <option value="company">Entreprise (A &rarr; Z)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Results Count Bar -->
    <div class="flex items-center justify-between text-xs text-zinc-400 px-0.5">
      <div id="resultsCount">-- offres</div>
      <label class="inline-flex items-center gap-2 cursor-pointer select-none">
        <input type="checkbox" id="hideAppliedToggle" class="rounded bg-zinc-900 border-zinc-700 text-indigo-500 focus:ring-0 w-3.5 h-3.5">
        <span>Masquer postulées</span>
      </label>
    </div>

    <!-- Job Cards List -->
    <section id="jobsContainer" class="space-y-2.5">
      <!-- Injected via JavaScript -->
    </section>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12 bg-zinc-900/30 rounded-lg border border-zinc-800/70 p-6">
      <p class="text-sm text-zinc-400">Aucun résultat trouvé.</p>
      <button id="resetFiltersBtn" class="mt-3 px-3 py-1.5 text-xs font-medium rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-200 transition">
        Réinitialiser
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 py-6 mt-12 text-center text-xs text-zinc-600">
    Stages Cybersécurité & Cryptologie — France
  </footer>

  <script src="app.js?v=9.0"></script>
</body>
</html>
